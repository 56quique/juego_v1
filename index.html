<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario de Productos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#33493F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inventario">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#22271F;
    --ink-soft:#6B6656;
    --paper:#FAF7F0;
    --kraft:#E4D9BE;
    --kraft-line:#CDBE97;
    --card:#FFFFFF;
    --pine:#33493F;
    --pine-dark:#243530;
    --brick:#A63A2C;
    --brass:#B98B33;
    --radius:4px;
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    padding-bottom:100px;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{
    font-family:var(--font-display);
    margin:0;
  }
  header{
    background:var(--pine);
    color:var(--paper);
    padding:22px 20px 20px;
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:3px solid var(--brass);
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#B9C9C0;
    margin-bottom:4px;
  }
  header h1{
    font-size:26px;
    font-weight:600;
    font-style:italic;
    letter-spacing:-0.01em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  header h1 .tag-icon{
    width:22px;height:22px;flex:none;
  }
  .subtitle{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:#AEC2B8;
    margin-top:5px;
    letter-spacing:0.02em;
  }

  .toolbar{
    padding:16px 16px 0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .search-row{
    display:flex;
    gap:8px;
  }
  input[type="text"], select{
    font-family:var(--font-body);
    font-size:15px;
    padding:11px 12px;
    border-radius:var(--radius);
    border:1px solid var(--kraft-line);
    background:var(--card);
    color:var(--ink);
    width:100%;
  }
  select{flex:none; width:auto; max-width:44%; font-family:var(--font-mono); font-size:12.5px;}

  .stats-row{
    display:flex;
    margin:16px 16px 4px;
    border:1px solid var(--kraft-line);
    border-radius:6px;
    background:var(--card);
    overflow:hidden;
  }
  .stat-pill{
    flex:1;
    padding:10px 8px;
    text-align:center;
    border-left:1px solid var(--kraft-line);
  }
  .stat-pill:first-child{border-left:none;}
  .stat-pill .n{font-family:var(--font-mono); font-size:19px; font-weight:600; color:var(--pine); font-variant-numeric:tabular-nums;}
  .stat-pill.agotados .n{color:var(--brick);}
  .stat-pill .l{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.08em; margin-top:2px;}

  .list{
    padding:16px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .empty-state{
    text-align:center;
    padding:60px 24px;
    color:var(--ink-soft);
  }
  .empty-state .big{
    font-family:var(--font-display);
    font-style:italic;
    font-size:19px;
    color:var(--ink);
    margin-bottom:6px;
  }

  .card{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--kraft-line);
    display:flex;
    overflow:hidden;
    position:relative;
  }
  /* Perforación tipo etiqueta colgante, entre la foto y la info */
  .card::before{
    content:"";
    position:absolute;
    left:96px;
    top:0;
    bottom:0;
    width:0;
    border-left:1.5px dashed var(--kraft-line);
    z-index:2;
  }
  .card::after{
    content:"";
    position:absolute;
    left:96px;
    top:50%;
    width:9px;
    height:9px;
    margin-left:-4.5px;
    margin-top:-4.5px;
    border-radius:50%;
    background:var(--paper);
    border:1.5px solid var(--kraft-line);
    z-index:3;
  }
  .card.agotado{
    opacity:0.72;
  }
  .card .thumb{
    width:96px;
    height:96px;
    flex:none;
    background:#EEE8D8;
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#B7AD90;
    font-family:var(--font-mono);
    font-size:10px;
    text-align:center;
  }
  .card .info{
    flex:1;
    padding:10px 14px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-width:0;
  }
  .card .name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .card .meta{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-soft);
    margin-top:4px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    align-items:center;
  }
  .badge{
    display:inline-block;
    font-family:var(--font-mono);
    font-size:9.5px;
    font-weight:600;
    letter-spacing:0.04em;
    padding:2px 6px;
    border-radius:3px;
    background:var(--pine);
    color:var(--paper);
    text-transform:uppercase;
  }
  .badge.agotado-badge{
    background:var(--brick);
  }
  .price{
    font-family:var(--font-mono);
    font-weight:600;
    color:var(--brass);
    font-size:14px;
    margin-top:4px;
    font-variant-numeric:tabular-nums;
  }
  .stock-controls{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:7px;
  }
  .stock-controls button{
    width:24px;height:24px;
    border-radius:4px;
    border:1px solid var(--kraft-line);
    background:var(--paper);
    color:var(--ink);
    font-size:14px;
    font-weight:700;
    line-height:1;
    cursor:pointer;
  }
  .stock-controls button:active{background:var(--kraft);}
  .stock-controls .stock-n{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--ink-soft);
    min-width:64px;
    font-variant-numeric:tabular-nums;
  }
  .card-actions{
    display:flex;
    flex-direction:column;
    border-left:1px solid var(--kraft-line);
  }
  .card-actions button{
    flex:1;
    width:42px;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:15px;
    cursor:pointer;
    border-bottom:1px solid var(--kraft-line);
  }
  .card-actions button:last-child{border-bottom:none;}
  .card-actions button:active{background:var(--paper);}

  .fab{
    position:fixed;
    right:18px;
    bottom:18px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:var(--pine);
    color:var(--paper);
    border:none;
    font-size:28px;
    box-shadow:0 6px 16px rgba(0,0,0,0.3);
    cursor:pointer;
    z-index:20;
  }
  .fab:active{background:var(--pine-dark);}

  .pdf-btn{
    position:fixed;
    left:18px;
    bottom:18px;
    height:44px;
    padding:0 16px;
    border-radius:4px;
    background:var(--card);
    color:var(--pine);
    border:1px solid var(--pine);
    font-family:var(--font-mono);
    font-weight:600;
    font-size:12px;
    letter-spacing:0.02em;
    display:flex;
    align-items:center;
    gap:6px;
    z-index:20;
    cursor:pointer;
  }

  /* Modal */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(20,24,22,0.55);
    z-index:50;
    display:none;
    align-items:flex-end;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--paper);
    width:100%;
    max-height:92vh;
    overflow-y:auto;
    border-radius:10px 10px 0 0;
    border-top:3px solid var(--brass);
    padding:20px 18px calc(18px + env(safe-area-inset-bottom));
    animation:slideup 0.22s ease;
  }
  @keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal h2{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:20px; margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-family:var(--font-mono);
    font-size:10.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .field input, .field textarea, .field select{
    width:100%;
    font-family:var(--font-body);
    font-size:15px;
    padding:11px 12px;
    border-radius:var(--radius);
    border:1px solid var(--kraft-line);
    background:var(--card);
    color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}

  .photo-picker{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
  }
  .photo-preview{
    width:76px;
    height:76px;
    border-radius:var(--radius);
    background:#EEE8D8;
    background-size:cover;
    background-position:center;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#B7AD90;
    font-size:22px;
    border:1.5px dashed var(--kraft-line);
  }
  .photo-buttons{display:flex; flex-direction:column; gap:8px; flex:1;}
  .photo-buttons button, .btn{
    font-family:var(--font-mono);
    font-weight:600;
    font-size:12.5px;
    padding:10px 12px;
    border-radius:var(--radius);
    border:1px solid var(--pine);
    background:var(--card);
    color:var(--pine);
    cursor:pointer;
  }
  .modal-buttons{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .btn-primary{
    flex:1;
    background:var(--pine);
    color:var(--paper);
    border:none;
    font-family:var(--font-display);
    font-weight:600;
    font-style:italic;
    font-size:16px;
    padding:13px;
    border-radius:var(--radius);
    cursor:pointer;
  }
  .btn-secondary{
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--kraft-line);
    font-family:var(--font-body);
    font-weight:600;
    font-size:14.5px;
    padding:13px 16px;
    border-radius:var(--radius);
    cursor:pointer;
  }
  .btn-danger{
    color:var(--brick);
    border-color:var(--brick);
  }

  #cameraInput{display:none;}

  .toast{
    position:fixed;
    top:14px;
    left:50%;
    transform:translateX(-50%) translateY(-30px);
    background:var(--ink);
    color:var(--paper);
    padding:10px 16px;
    border-radius:6px;
    font-family:var(--font-body);
    font-size:13.5px;
    z-index:100;
    opacity:0;
    transition:all 0.25s ease;
    pointer-events:none;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .install-banner{
    margin:12px 16px 0;
    background:#F3E7C9;
    border:1px solid var(--brass);
    border-radius:6px;
    padding:10px 12px;
    font-family:var(--font-body);
    font-size:12.5px;
    color:#6B531E;
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .install-banner.show{display:flex;}
  .install-banner button{
    background:var(--brass);
    color:var(--paper);
    border:none;
    padding:7px 12px;
    border-radius:4px;
    font-family:var(--font-mono);
    font-weight:700;
    font-size:12px;
    flex:none;
  }
  ::selection{background:var(--brass); color:var(--paper);}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Planilla de depósito</div>
  <h1>
    <svg class="tag-icon" viewBox="0 0 24 24" fill="none">
      <path d="M10 3H5.5L3 6.5V11L12.5 20.5C13.3 21.3 14.6 21.3 15.4 20.5L20.5 15.4C21.3 14.6 21.3 13.3 20.5 12.5L10 3Z" stroke="#FAF7F0" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="7.3" cy="7.3" r="1.4" fill="#B98B33"/>
    </svg>
    Inventario
  </h1>
  <div class="subtitle">stock · fotos · exportación a PDF</div>
</header>

<div class="install-banner" id="installBanner">
  <span>Instalá la app en tu pantalla de inicio para usarla sin internet.</span>
  <button id="installBtn">Instalar</button>
</div>

<div class="toolbar">
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Buscar producto...">
    <select id="categoryFilter">
      <option value="">Todas</option>
    </select>
  </div>
</div>

<div class="stats-row">
  <div class="stat-pill">
    <div class="n" id="statTotal">0</div>
    <div class="l">Productos</div>
  </div>
  <div class="stat-pill">
    <div class="n" id="statUnidades">0</div>
    <div class="l">Unidades</div>
  </div>
  <div class="stat-pill agotados">
    <div class="n" id="statAgotados">0</div>
    <div class="l">Agotados</div>
  </div>
</div>

<div class="list" id="list"></div>

<button class="pdf-btn" id="exportPdfBtn">⬇ Exportar PDF</button>
<button class="fab" id="addBtn">+</button>

<input type="file" id="cameraInput" accept="image/*" capture="environment">

<!-- Modal alta/edición -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Nuevo producto</h2>

    <div class="photo-picker">
      <div class="photo-preview" id="photoPreview">📷</div>
      <div class="photo-buttons">
        <button type="button" id="takePhotoBtn">📸 Sacar foto</button>
        <button type="button" id="removePhotoBtn" style="display:none;">Quitar foto</button>
      </div>
    </div>

    <div class="field">
      <label>Nombre del producto</label>
      <input type="text" id="fieldNombre" placeholder="Ej: Zapatillas urbanas negras">
    </div>

    <div class="row2">
      <div class="field">
        <label>Categoría</label>
        <input type="text" id="fieldCategoria" placeholder="Ej: Zapatillas" list="categoryList">
        <datalist id="categoryList"></datalist>
      </div>
      <div class="field">
        <label>Talle</label>
        <input type="text" id="fieldTalle" placeholder="Ej: 42">
      </div>

    <div class="row2">
      <div class="field">
        <label>Precio</label>
        <input type="number" id="fieldPrecio" placeholder="0" inputmode="decimal">
      </div>
      <div class="field">
        <label>Stock en depósito</label>
        <input type="number" id="fieldStock" placeholder="0" inputmode="numeric">
      </div>
    </div>

    <div class="field">
      <label>Notas</label>
      <textarea id="fieldNotas" placeholder="Opcional"></textarea>
    </div>

    <div class="modal-buttons">
      <button class="btn-secondary" id="cancelBtn">Cancelar</button>
      <button class="btn-primary" id="saveBtn">Guardar</button>
    </div>
    <div class="modal-buttons" id="deleteRow" style="display:none;">
      <button class="btn-secondary btn-danger" id="deleteBtn" style="width:100%;">Eliminar producto</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="jspdf.umd.min.js"></script>
<script>
/* ============================================================
   INVENTARIO DE PRODUCTOS - lógica de la app
   Guarda todo en IndexedDB (local, en el celular, sin internet)
   ============================================================ */

// ---------- Base de datos local (IndexedDB) ----------
const DB_NAME = "inventario-db";
const DB_VERSION = 1;
const STORE = "productos";
let db;

function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const database = e.target.result;
      if(!database.objectStoreNames.contains(STORE)){
        const store = database.createObjectStore(STORE, {keyPath:"id"});
        store.createIndex("categoria", "categoria", {unique:false});
      }
    };
    req.onsuccess = (e)=>resolve(e.target.result);
    req.onerror = (e)=>reject(e);
  });
}

function dbGetAll(){
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, "readonly");
    const store = tx.objectStore(STORE);
    const req = store.getAll();
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = (e)=>reject(e);
  });
}

function dbPut(item){
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(item);
    tx.oncomplete = ()=>resolve();
    tx.onerror = (e)=>reject(e);
  });
}

function dbDelete(id){
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = (e)=>reject(e);
  });
}

// ---------- Estado ----------
let productos = [];
let editingId = null;
let currentPhotoData = null;

// ---------- Elementos ----------
const listEl = document.getElementById("list");
const searchInput = document.getElementById("searchInput");
const categoryFilter = document.getElementById("categoryFilter");
const modalOverlay = document.getElementById("modalOverlay");
const modalTitle = document.getElementById("modalTitle");
const photoPreview = document.getElementById("photoPreview");
const cameraInput = document.getElementById("cameraInput");
const toastEl = document.getElementById("toast");

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"), 1800);
}

function formatPrice(n){
  n = Number(n)||0;
  return "$" + n.toLocaleString("es-AR");
}

// ---------- Render ----------
function render(){
  const term = searchInput.value.trim().toLowerCase();
  const cat = categoryFilter.value;

  let filtered = productos.filter(p=>{
    const matchTerm = !term || p.nombre.toLowerCase().includes(term);
    const matchCat = !cat || p.categoria === cat;
    return matchTerm && matchCat;
  });

  // ordenar: más nuevos primero
  filtered.sort((a,b)=> b.creado - a.creado);

  listEl.innerHTML = "";

  if(filtered.length === 0){
    listEl.innerHTML = `<div class="empty-state">
      <div class="big">Sin productos todavía</div>
      Tocá el botón + para fotografiar tu primer producto
    </div>`;
  }

  filtered.forEach(p=>{
    const agotado = Number(p.stock) <= 0;
    const card = document.createElement("div");
    card.className = "card" + (agotado ? " agotado" : "");

    const thumbStyle = p.foto ? `style="background-image:url('${p.foto}')"` : "";
    const thumbContent = p.foto ? "" : "sin foto";

    card.innerHTML = `
      <div class="thumb" ${thumbStyle}>${thumbContent}</div>
      <div class="info">
        <div class="name">${escapeHtml(p.nombre || "Sin nombre")}</div>
        <div class="meta">
          ${p.categoria ? `<span class="badge">${escapeHtml(p.categoria)}</span>` : ""}
          ${p.talle ? `<span>Talle ${escapeHtml(p.talle)}</span>` : ""}
          ${agotado ? `<span class="badge agotado-badge">Agotado</span>` : ""}
        </div>
        ${p.precio ? `<div class="price">${formatPrice(p.precio)}</div>` : ""}
        <div class="stock-controls">
          <button data-action="dec" data-id="${p.id}">−</button>
          <span class="stock-n">${p.stock ?? 0} en stock</span>
          <button data-action="inc" data-id="${p.id}">+</button>
        </div>
      </div>
      <div class="card-actions">
        <button data-action="edit" data-id="${p.id}">✎</button>
        <button data-action="delete" data-id="${p.id}">🗑</button>
      </div>
    `;
    listEl.appendChild(card);
  });

  // stats
  document.getElementById("statTotal").textContent = productos.length;
  document.getElementById("statUnidades").textContent = productos.reduce((s,p)=>s+(Number(p.stock)||0),0);
  document.getElementById("statAgotados").textContent = productos.filter(p=>Number(p.stock)<=0).length;

  // categorías del filtro
  const cats = [...new Set(productos.map(p=>p.categoria).filter(Boolean))].sort();
  const currentVal = categoryFilter.value;
  categoryFilter.innerHTML = `<option value="">Todas</option>` + cats.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  categoryFilter.value = currentVal;

  const dl = document.getElementById("categoryList");
  dl.innerHTML = cats.map(c=>`<option value="${escapeHtml(c)}">`).join("");
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ---------- Cargar datos iniciales ----------
async function init(){
  db = await openDB();
  productos = await dbGetAll();
  render();
}
init();

// ---------- Buscar / filtrar ----------
searchInput.addEventListener("input", render);
categoryFilter.addEventListener("change", render);

// ---------- Acciones sobre tarjetas (stock, editar, borrar) ----------
listEl.addEventListener("click", async (e)=>{
  const btn = e.target.closest("button[data-action]");
  if(!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  const producto = productos.find(p=>p.id === id);
  if(!producto) return;

  if(action === "dec"){
    producto.stock = Math.max(0, (Number(producto.stock)||0) - 1);
    await dbPut(producto);
    if(Number(producto.stock) === 0) showToast(`"${producto.nombre}" quedó agotado`);
    render();
  }
  if(action === "inc"){
    producto.stock = (Number(producto.stock)||0) + 1;
    await dbPut(producto);
    render();
  }
  if(action === "edit"){
    openModal(producto);
  }
  if(action === "delete"){
    if(confirm(`¿Eliminar "${producto.nombre}"?`)){
      await dbDelete(id);
      productos = productos.filter(p=>p.id!==id);
      render();
    }
  }
});

// ---------- Modal alta/edición ----------
const addBtn = document.getElementById("addBtn");
const cancelBtn = document.getElementById("cancelBtn");
const saveBtn = document.getElementById("saveBtn");
const deleteBtn = document.getElementById("deleteBtn");
const deleteRow = document.getElementById("deleteRow");
const takePhotoBtn = document.getElementById("takePhotoBtn");
const removePhotoBtn = document.getElementById("removePhotoBtn");

const fieldNombre = document.getElementById("fieldNombre");
const fieldCategoria = document.getElementById("fieldCategoria");
const fieldTalle = document.getElementById("fieldTalle");
const fieldPrecio = document.getElementById("fieldPrecio");
const fieldStock = document.getElementById("fieldStock");
const fieldNotas = document.getElementById("fieldNotas");

function openModal(producto){
  editingId = producto ? producto.id : null;
  currentPhotoData = producto ? producto.foto : null;

  modalTitle.textContent = producto ? "Editar producto" : "Nuevo producto";
  fieldNombre.value = producto?.nombre || "";
  fieldCategoria.value = producto?.categoria || "";
  fieldTalle.value = producto?.talle || "";
  fieldPrecio.value = producto?.precio || "";
  fieldStock.value = producto?.stock ?? "";
  fieldNotas.value = producto?.notas || "";

  updatePhotoPreview();
  deleteRow.style.display = producto ? "flex" : "none";

  modalOverlay.classList.add("open");
}

function closeModal(){
  modalOverlay.classList.remove("open");
  editingId = null;
  currentPhotoData = null;
}

function updatePhotoPreview(){
  if(currentPhotoData){
    photoPreview.style.backgroundImage = `url('${currentPhotoData}')`;
    photoPreview.textContent = "";
    removePhotoBtn.style.display = "block";
  } else {
    photoPreview.style.backgroundImage = "";
    photoPreview.textContent = "📷";
    removePhotoBtn.style.display = "none";
  }
}

addBtn.addEventListener("click", ()=>openModal(null));
cancelBtn.addEventListener("click", closeModal);
modalOverlay.addEventListener("click", (e)=>{ if(e.target===modalOverlay) closeModal(); });

takePhotoBtn.addEventListener("click", ()=>cameraInput.click());
removePhotoBtn.addEventListener("click", ()=>{ currentPhotoData=null; updatePhotoPreview(); });

cameraInput.addEventListener("change", (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    // Redimensionar para no ocupar demasiado espacio en el celular
    const img = new Image();
    img.onload = ()=>{
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      currentPhotoData = canvas.toDataURL("image/jpeg", 0.75);
      updatePhotoPreview();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  cameraInput.value = "";
});

saveBtn.addEventListener("click", async ()=>{
  const nombre = fieldNombre.value.trim();
  if(!nombre){
    showToast("Poné un nombre al producto");
    return;
  }

  const producto = {
    id: editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
    nombre,
    categoria: fieldCategoria.value.trim(),
    talle: fieldTalle.value.trim(),
    precio: fieldPrecio.value ? Number(fieldPrecio.value) : 0,
    stock: fieldStock.value ? Number(fieldStock.value) : 0,
    notas: fieldNotas.value.trim(),
    foto: currentPhotoData,
    creado: editingId ? (productos.find(p=>p.id===editingId)?.creado || Date.now()) : Date.now()
  };

  await dbPut(producto);
  const idx = productos.findIndex(p=>p.id===producto.id);
  if(idx>=0) productos[idx]=producto; else productos.push(producto);

  closeModal();
  render();
  showToast("Producto guardado");
});

deleteBtn.addEventListener("click", async ()=>{
  if(!editingId) return;
  if(confirm("¿Eliminar este producto?")){
    await dbDelete(editingId);
    productos = productos.filter(p=>p.id!==editingId);
    closeModal();
    render();
  }
});

// ---------- Exportar PDF ----------
document.getElementById("exportPdfBtn").addEventListener("click", async ()=>{
  if(productos.length === 0){
    showToast("No hay productos para exportar");
    return;
  }
  showToast("Generando PDF...");

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"pt", format:"a4" });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 32;
  const cardW = (pageW - margin*2 - 16) / 2;
  const cardH = 150;
  const gap = 16;

  let x = margin, y = margin;
  let col = 0;

  doc.setFont("helvetica","bold");
  doc.setFontSize(16);
  doc.setTextColor(47,93,80);
  doc.text("Catálogo de Inventario", margin, y);
  doc.setFontSize(9);
  doc.setTextColor(120,120,120);
  doc.text(new Date().toLocaleDateString("es-AR"), pageW - margin, y, {align:"right"});
  y += 22;

  const ordenados = [...productos].sort((a,b)=> (a.categoria||"").localeCompare(b.categoria||"") || a.nombre.localeCompare(b.nombre));

  for(const p of ordenados){
    if(y + cardH > pageH - margin){
      if(col === 1){ col = 0; x = margin; }
      doc.addPage();
      x = margin; y = margin; col = 0;
    }
    if(col === 0 && x !== margin){ x = margin; }

    // marco
    doc.setDrawColor(228,224,216);
    doc.roundedRect(x, y, cardW, cardH, 6, 6);

    // foto
    const imgSize = cardH - 16;
    if(p.foto){
      try{
        doc.addImage(p.foto, "JPEG", x+8, y+8, imgSize, imgSize, undefined, "FAST");
      }catch(err){
        doc.setFillColor(237,234,227);
        doc.rect(x+8, y+8, imgSize, imgSize, "F");
      }
    } else {
      doc.setFillColor(237,234,227);
      doc.rect(x+8, y+8, imgSize, imgSize, "F");
      doc.setFontSize(8);
      doc.setTextColor(180,176,162);
      doc.text("sin foto", x+8+imgSize/2, y+8+imgSize/2, {align:"center"});
    }

    const textX = x + 16 + imgSize;
    const textW = cardW - imgSize - 24;
    let ty = y + 20;

    doc.setFont("helvetica","bold");
    doc.setFontSize(11);
    doc.setTextColor(31,36,33);
    const nameLines = doc.splitTextToSize(p.nombre || "Sin nombre", textW);
    doc.text(nameLines, textX, ty);
    ty += nameLines.length*13 + 4;

    doc.setFont("helvetica","normal");
    doc.setFontSize(9);
    doc.setTextColor(90,95,90);
    if(p.categoria) { doc.text("Categoría: " + p.categoria, textX, ty); ty += 12; }
    if(p.talle) { doc.text("Talle: " + p.talle, textX, ty); ty += 12; }
    if(p.precio) { doc.text("Precio: " + formatPrice(p.precio), textX, ty); ty += 12; }

    const agotado = Number(p.stock) <= 0;
    doc.setFont("helvetica","bold");
    if(agotado){
      doc.setTextColor(180,72,58);
      doc.text("AGOTADO", textX, ty);
    } else {
      doc.setTextColor(47,93,80);
      doc.text("Stock: " + p.stock, textX, ty);
    }
    ty += 12;

    if(p.notas){
      doc.setFont("helvetica","italic");
      doc.setFontSize(8);
      doc.setTextColor(120,120,120);
      const noteLines = doc.splitTextToSize(p.notas, textW).slice(0,2);
      doc.text(noteLines, textX, ty);
    }

    if(col === 0){
      col = 1;
      x += cardW + gap;
    } else {
      col = 0;
      x = margin;
      y += cardH + gap;
    }
  }

  doc.save("inventario.pdf");
});

// ---------- Instalación PWA ----------
let deferredPrompt;
const installBanner = document.getElementById("installBanner");
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  installBanner.classList.add("show");
});

installBtn.addEventListener("click", async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBanner.classList.remove("show");
});

window.addEventListener("appinstalled", ()=>{
  installBanner.classList.remove("show");
});

// ---------- Registrar Service Worker ----------
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(err=>console.log("SW error:", err));
  });
}
